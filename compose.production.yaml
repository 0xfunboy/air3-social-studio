# Use with compose.yaml. This is a single-host deployment, not a replicated database cluster.
services:
  studio:
    environment:
      TRUST_PROXY_IPS: 172.30.43.2
    networks:
      edge:
        ipv4_address: 172.30.43.3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public hostname generated by setup --url}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      studio:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.30.43.2
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.43.0/24
volumes:
  caddy-data:
  caddy-config:
