services:
  studio:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - studio-data:/app/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
volumes:
  studio-data:
